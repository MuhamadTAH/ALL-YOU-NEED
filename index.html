<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopify Chatbot</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
    #chat { height: 400px; overflow-y: auto; background: white; padding: 10px; border: 1px solid #ccc; }
    .message { margin: 10px 0; }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>
  <h2>Ask the Assistant</h2>
  <div id="chat"></div>
  <input type="text" id="userInput" placeholder="Type your question..." />
  <button onclick="handleSend()">Send</button>

  <script>
    function addMessage(text, sender) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.innerText = (sender === "user" ? "You: " : "Bot: ") + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function displayBotReply(text) {
      addMessage(text, "bot");
    }

    function handleSend() {
      const input = document.getElementById("userInput");
      const message = input.value;
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      sendMessageToN8N(message);
    }

    function sendMessageToN8N(userMessage) {
      fetch("https://hivematic.app.n8n.cloud/webhook/66dcc32f-bd72-4183-b6ea-903bd0f590ca", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: "John", // Later you can replace this with dynamic name
          email: "john@example.com",
          message: userMessage
        })
      })
      .then(res => res.json())
      .then(data => {
        displayBotReply(data.reply); // Show reply from N8N
      })
      .catch(err => {
        console.error("Error:", err);
        displayBotReply("Sorry, something went wrong.");
      });
    }
  </script>
</body>
</html>
